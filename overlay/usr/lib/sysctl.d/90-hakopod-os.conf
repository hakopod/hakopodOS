# hakopodOS kernel hardening. Only settings that leave K3s, flannel and
# containerd untouched; reverse-path filtering is left at the distro default
# because strict mode drops pod traffic.

# Hide kernel pointers and the kernel log from unprivileged users.
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1

# No unprivileged eBPF, harden the JIT, no unprivileged perf events.
kernel.unprivileged_bpf_disabled = 1
net.core.bpf_jit_harden = 2
kernel.perf_event_paranoid = 3

# Only a process's ancestors may ptrace it.
kernel.yama.ptrace_scope = 1

# No loading a new kernel at runtime, no magic SysRq.
kernel.kexec_load_disabled = 1
kernel.sysrq = 0

# No core dumps of setuid programs; protect FIFOs and files in sticky dirs.
fs.suid_dumpable = 0
fs.protected_fifos = 2
fs.protected_regular = 2

# Ignore ICMP redirects and source routing.
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_source_route = 0
