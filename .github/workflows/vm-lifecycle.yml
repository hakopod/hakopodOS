name: VM lifecycle
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:
    inputs:
      hakopod_version:
        description: Hakopod release installed inside the VM
        type: string
        default: 0.1.0-alpha.75
permissions:
  contents: read
concurrency:
  group: vm-lifecycle-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qemu:
    name: ${{ matrix.flavor }}
    strategy:
      fail-fast: false
      matrix:
        flavor: [metal, cloud, aws]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Enable KVM and install QEMU
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-system-x86 qemu-utils
          test -w /dev/kvm
      - name: Install, reboot, upgrade, roll back
        env:
          HAKOPOD_VERSION: ${{ inputs.hakopod_version || '0.1.0-alpha.75' }}
          FLAVOR: ${{ matrix.flavor }}
        run: tests/qemu/lifecycle.sh
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vm-lifecycle-${{ matrix.flavor }}
          path: report
          if-no-files-found: warn
