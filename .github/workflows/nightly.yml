name: Nightly
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nightly
  cancel-in-progress: false
jobs:
  hakopod:
    name: Newest Hakopod tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Newest non-draft release, prereleases included, not GitHub's "Latest".
        run: |
          tag=$(gh release list --repo hakopod/hakopod --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName')
          test -n "$tag"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  lifecycle:
    needs: hakopod
    uses: ./.github/workflows/vm-lifecycle.yml
    with:
      hakopod_version: ${{ needs.hakopod.outputs.version }}

  build:
    name: ${{ matrix.flavor }}
    strategy:
      fail-fast: false
      matrix:
        flavor: [metal, cloud]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Enable KVM and install QEMU
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-system-x86 qemu-utils ovmf genisoimage zstd
          test -w /dev/kvm
      - name: Version
        id: version
        run: echo "version=0.0.0-nightly.$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
      - name: Build the OS image
        run: docker build --build-arg VERSION=v${{ steps.version.outputs.version }} --build-arg FLAVOR=${{ matrix.flavor }} -t hakopod-os:${{ matrix.flavor }} .
      - name: Build installer and disk images
        run: release/build-artifacts.sh ${{ matrix.flavor }} ${{ steps.version.outputs.version }} hakopod-os:${{ matrix.flavor }} dist
      - name: Boot the artifacts
        run: tests/qemu/artifacts.sh ${{ matrix.flavor }} ${{ steps.version.outputs.version }} dist
      - name: Upload boot logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-${{ matrix.flavor }}
          path: report-artifacts
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: iso-${{ matrix.flavor }}
          path: dist/*.iso
          retention-days: 1
          compression-level: 0

  publish:
    needs: [hakopod, lifecycle, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: iso-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Replace the nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HAKOPOD_VERSION: ${{ needs.hakopod.outputs.version }}
        run: |
          gh release delete nightly --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create nightly dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "hakopodOS nightly $(date -u +%F)" --notes-file - <<EOF
          Installer ISOs built from \`${GITHUB_SHA::12}\`, replaced every night. Not for production; use a versioned release.

          The same run installed Hakopod $HAKOPOD_VERSION (newest hakopod/hakopod tag) on this OS: [results]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID).

          Verify a download: \`sha256sum --check --ignore-missing SHA256SUMS\`.
          EOF
